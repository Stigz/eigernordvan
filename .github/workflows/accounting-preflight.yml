name: Accounting Preflight

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Optional API base URL override. Leave empty to use Terraform output."
        required: false
        default: ""
      upload_backup:
        description: "Upload the compressed backup to the Terraform backup S3 bucket."
        required: true
        type: boolean
        default: true

concurrency:
  group: accounting-preflight
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      - name: Initialize Terraform state
        env:
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY || 'eigernordvan/terraform.tfstate' }}
          TF_BACKEND_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
        run: make terraform-init

      - name: Resolve live endpoints
        env:
          API_BASE_URL_INPUT: ${{ inputs.api_base_url }}
        run: |
          api_base_url="${API_BASE_URL_INPUT%/}"
          if [[ -z "$api_base_url" ]]; then
            api_base_url="$(cd infra && terraform output -raw api_url)"
          fi
          backup_bucket="$(cd infra && terraform output -raw backup_bucket_name)"

          {
            echo "API_BASE_URL=$api_base_url"
            echo "BACKUP_BUCKET=$backup_bucket"
          } >> "$GITHUB_ENV"

      - name: Run backend tests
        run: |
          cd backend
          GOCACHE="${GOCACHE:-/tmp/eigernordvan-go-cache}" go test ./...

      - name: Run frontend tests and build
        run: |
          cd frontend
          npm ci
          npm test -- --run
          npm run build

      - name: Export live backup
        run: ./scripts/export-backup.sh "$API_BASE_URL" backups/preflight

      - name: Upload backup to S3
        if: ${{ inputs.upload_backup }}
        run: |
          prefix="accounting-preflight/${GITHUB_RUN_ID}"
          aws s3 cp backups/preflight "s3://${BACKUP_BUCKET}/${prefix}/" \
            --recursive \
            --exclude "*" \
            --include "*.json.gz" \
            --include "*.sha256"
          echo "BACKUP_S3_PREFIX=s3://${BACKUP_BUCKET}/${prefix}/" >> "$GITHUB_ENV"

      - name: Write run summary
        run: |
          {
            echo "### Accounting preflight"
            echo
            echo "- Backend tests passed"
            echo "- Frontend tests and build passed"
            echo "- Live backup export completed"
            if [[ -n "${BACKUP_S3_PREFIX:-}" ]]; then
              echo "- Backup uploaded to \`${BACKUP_S3_PREFIX}\`"
            else
              echo "- Backup upload skipped"
            fi
            echo
            echo "Checksum:"
            echo '```'
            cat backups/preflight/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
