name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      - name: Pre-deploy live backup
        env:
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY || 'eigernordvan/terraform.tfstate' }}
          TF_BACKEND_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
        run: |
          make terraform-init
          api_base_url="$(cd infra && terraform output -raw api_url)"
          backup_bucket="$(cd infra && terraform output -raw backup_bucket_name)"

          ./scripts/export-backup.sh "$api_base_url" backups/predeploy

          prefix="predeploy/${GITHUB_RUN_ID}"
          aws s3 cp backups/predeploy "s3://${backup_bucket}/${prefix}/" \
            --recursive \
            --exclude "*" \
            --include "*.json.gz" \
            --include "*.sha256"

          {
            echo "### Pre-deploy backup"
            echo
            echo "- Backup uploaded to \`s3://${backup_bucket}/${prefix}/\`"
            echo
            echo "Checksum:"
            echo '```'
            cat backups/predeploy/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        env:
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY || 'eigernordvan/terraform.tfstate' }}
          TF_BACKEND_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
        run: make deploy-ci
